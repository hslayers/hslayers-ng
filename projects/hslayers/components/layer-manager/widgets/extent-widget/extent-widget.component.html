@if (isEnabled | async) {
<div class="hs-widget-extent">
  <div class="hs-widget-header">
    <div class="form-check">
      <input id="hs-layer-extent-toggle" name="layer-extent-toggle" class="form-check-input" type="checkbox"
        (change)="toggleIgnoreExtent()" [checked]="ignoreExtent" />
      <label for="hs-layer-extent-toggle" class="form-check-label">
        {{ "LAYERMANAGER.layerEditor.ignoreExtent" | translate }}
      </label>
      <i class="fa-solid fa-circle-info ms-2 text-muted"
        [title]="'LAYERMANAGER.layerEditor.ignoreExtentInfo' | translate" (click)="$event.stopPropagation()"></i>
    </div>
  </div>
</div>
}
