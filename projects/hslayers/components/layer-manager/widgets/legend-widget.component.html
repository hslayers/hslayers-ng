@if (olLayer && hsLayerEditorService.legendVisible()) {
<div class="hs-widget-legend">
  <div class="hs-widget-header-title">
    <i class="fa-solid fa-map-signs me-2"></i>
    <span>{{ "COMMON.legend" | translate }}</span>
  </div>
  <div class="hs-widget-content-simple">
    <hs-legend-layer [layer]="hsLayerEditorService.legendDescriptor" />
  </div>
</div>
}
