@if (isEnabled | async) {
<div class="hs-widget-folder">
  <div class="hs-widget-header-title">
    <i class="fa-solid fa-folder me-2"></i>
    <span>{{ "COMMON.folder" | translate }}</span>
  </div>
  <div class="hs-widget-content-simple">
    <button type="button" class="btn btn-outline-primary btn-sm w-100" (click)="createDialog()">
      <i class="fa-solid fa-folder-arrow-up me-1"></i>
      {{'LAYERMANAGER.layerEditor.moveToNewFolder' | translate}}
    </button>
  </div>
</div>
}
