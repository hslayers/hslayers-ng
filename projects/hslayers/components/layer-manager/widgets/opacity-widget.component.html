<div class="hs-widget-opacity" [style.--opacity-percentage.%]="opacity * 100">
  <div class="hs-widget-header-simple">
    <div class="d-flex justify-content-between align-items-center">
      <label for="layer-opacity-range" class="mb-0">{{ "LAYERMANAGER.layerEditor.opacity" | translate }}</label>
      <span class="badge bg-secondary">{{ (opacity * 100) | number:'1.0-0' }}%</span>
    </div>
  </div>
  <div class="hs-widget-content-simple">
    <input id="layer-opacity-range" type="range" name="layer-opacity" step="0.01" min="0" max="1" [(ngModel)]="opacity"
      class="form-range" />
  </div>
</div>
