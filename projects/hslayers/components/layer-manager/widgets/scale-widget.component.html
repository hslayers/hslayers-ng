<div class="hs-widget-scale">
  <div class="hs-widget-header">
    <div class="form-check">
      <input type="checkbox" [id]="'scale-enabled-' + name" [checked]="scaleEnabled()" (change)="toggle()"
        class="form-check-input" />
      <label [for]="'scale-enabled-' + name" class="form-check-label">
        {{ "COMMON.scale" | translate }}
      </label>
    </div>
  </div>

  @if (scaleEnabled()) {
  <div class="hs-widget-content">
    <div class="hs-scale-inputs">
      <div class="hs-scale-input-group">
        <label [for]="'min-scale-' + name" class="small text-muted">
          {{ "COMMON.from" | translate }}
        </label>
        <div class="input-group input-group-sm">
          <span class="input-group-text">1:</span>
          <input type="number" [id]="'min-scale-' + name" class="form-control" [(ngModel)]="minResolution"
            name="minResolution" [placeholder]="placeholder" min="1" step="1" />
        </div>
      </div>

      <div class="hs-scale-input-group">
        <label [for]="'max-scale-' + name" class="small text-muted">
          {{ "COMMON.to" | translate }}
        </label>
        <div class="input-group input-group-sm">
          <span class="input-group-text">1:</span>
          <input type="number" [id]="'max-scale-' + name" class="form-control" [(ngModel)]="maxResolution"
            name="maxResolution" [placeholder]="placeholder" min="1" step="1" />
        </div>
      </div>
    </div>

    @if (minResolutionValid() && maxResolutionValid()) {
    <div class="hs-scale-summary">
      <i class="fa-solid fa-ruler-horizontal me-1"></i>
      <span>{{ "COMMON.from" | translate }} 1:{{ minResolution }}</span>
      <span class="mx-1">→</span>
      <span>1:{{ maxResolution }}</span>
    </div>
    }
  </div>
  }
</div>
