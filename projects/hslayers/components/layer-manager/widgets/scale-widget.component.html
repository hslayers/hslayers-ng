<div class="form-group mt-2">
  <div class="d-flex align-items-center gap-2 mb-2">
    <input type="checkbox" [id]="'scale-enabled-' + name" [checked]="scaleEnabled()" (change)="toggle()"
      class="form-check-input" />
    <label [for]="'scale-enabled-' + name" class="form-check-label mb-0">
      {{ "COMMON.scale" | translate }}
    </label>
  </div>

  @if (scaleEnabled()) {
  <div class="scale-inputs ms-2 mt-2">
    <div class="mb-2">
      <label [for]="'min-scale-' + name" class="form-label small text-muted mb-1">
        {{ "COMMON.from" | translate }}
      </label>
      <div class="input-group">
        <span class="input-group-text">1:</span>
        <input type="number" [id]="'min-scale-' + name" class="form-control" [(ngModel)]="minResolution"
          name="minResolution" [placeholder]="placeholder" min="1" step="1" />
      </div>
    </div>

    <div class="mb-2">
      <label [for]="'max-scale-' + name" class="form-label small text-muted mb-1">
        {{ "COMMON.to" | translate }}
      </label>
      <div class="input-group">
        <span class="input-group-text">1:</span>
        <input type="number" [id]="'max-scale-' + name" class="form-control" [(ngModel)]="maxResolution"
          name="maxResolution" [placeholder]="placeholder" min="1" step="1" />
      </div>
    </div>

    @if (minResolutionValid() && maxResolutionValid()) {
    <div class="small text-muted mt-2">
      <span>{{ "COMMON.from" | translate }} 1:{{ minResolution }}</span>
      <span class="ms-2">{{ "COMMON.to" | translate }} 1:{{ maxResolution }}</span>
    </div>
    }
  </div>
  }
</div>
